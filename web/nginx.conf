server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Includes multipart overhead. Align with KB_MAX_UPLOAD_BYTES and the ingress limit.
    client_max_body_size 21m;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-cache always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    gzip on;
    gzip_types text/css application/javascript application/json;
    # Docker DNS 延迟解析：Agent 尚未部署时不阻止知识后台启动。
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $agent_origin ${KB_AGENT_UPSTREAM};
    location ^~ /api/agent/ {
        proxy_pass $agent_origin;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_connect_timeout 5s;
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
        proxy_buffering off;
        proxy_ignore_client_abort off;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }
    location ~ ^/(api|openapi)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
        proxy_buffering off;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
