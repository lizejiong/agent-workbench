      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/RefreshRequest"
      "description": "Quick durable command. requestId scoped to trusted tenant/owner, confirmation/version part of identity. Active ingestion/another refresh conflicts. Manual changes require confirmOverwriteEdited and reviewed expectedDocumentVersion. Run statuses PENDING/RUNNING/WAITING_INGESTION then SUCCESS/FAILED/SKIPPED; unchanged never parses or embeds. Expired claims recover finitely; old credentials cannot activate. Failed refresh ingestion must retry via a new refresh request, not ingestion-job retry."
