"components":
  "securitySchemes":
    "basicAuth":
      "type": "http"
      "scheme": "basic"
  "schemas":
    "Splitter":
      "type": "object"
      "additionalProperties": false
      "properties":
        "kind":
          "type": "string"
          "enum":
            - "STRUCTURAL"
            - "WHOLE_DOCUMENT"
          "default": "STRUCTURAL"
        "maxChars":
          "type": "integer"
          "format": "int64"
          "minimum": 128
          "maximum": 4000
          "default": 1024
        "overlapChars":
          "type": "integer"
          "format": "int64"
          "minimum": 0
          "maximum": 1000
          "default": 128
          "description": "Must be less than maxChars"
        "tableRows":
          "type": "integer"
          "format": "int64"
          "minimum": 1
          "maximum": 1000
          "default": 50
        "toleranceChars":
          "type": "integer"
          "format": "int64"
          "minimum": 0
          "maximum": 4096
          "default": 512
      "required": []
    "IngestionSpec":
      "type": "object"
      "additionalProperties": false
      "properties":
        "schemaVersion":
          "type": "integer"
          "format": "int64"
          "enum":
            - 1
          "default": 1
        "parser":
          "type": "string"
          "enum":
            - "AUTO"
            - "TEXT"
            - "MARKDOWN"
          "default": "AUTO"
        "splitter":
          "$ref": "#/components/schemas/Splitter"
        "parseProfile":
          "type": "string"
          "enum":
            - "fast"
            - "fidelity"
          "default": "fast"
          "description": "PDF fidelity requires explicit MinerU2.7.6. TXT/MD/CSV/Excel fidelity aliases local; images both use configured VLM; Office fidelity unavailable."
      "required": []
    "UploadMetadata":
      "type": "object"
      "additionalProperties": false
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 255
        "ingestionSpec":
          "$ref": "#/components/schemas/IngestionSpec"
      "required": []
    "CreateRequest":
      "type": "object"
      "additionalProperties": false
      "properties":
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 128
        "description":
          "type": "string"
          "maxLength": 2000
          "nullable": true
        "embeddingProfileId":
          "type": "string"
          "maxLength": 128
          "description": "Allowed server catalog id; default server profile when omitted"
      "required":
        - "name"
    "PatchBase":
      "type": "object"
      "additionalProperties": false
      "properties":
        "version":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 128
        "description":
          "type": "string"
          "maxLength": 2000
        "embeddingProfileId":
          "type": "string"
          "maxLength": 128
          "description": "Immutable after binding; different value returns 409"
      "required":
        - "version"
    "ReplaceBase":
      "type": "object"
      "additionalProperties": false
      "properties":
        "version":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "name":
          "type": "string"
          "minLength": 1
          "maxLength": 128
        "description":
          "type": "string"
          "maxLength": 2000
          "nullable": true
      "required":
        - "version"
        - "name"
    "BindRequest":
      "type": "object"
      "additionalProperties": false
      "properties":
        "version":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "embeddingProfileId":
          "type": "string"
          "minLength": 1
          "maxLength": 128
      "required":
        - "version"
