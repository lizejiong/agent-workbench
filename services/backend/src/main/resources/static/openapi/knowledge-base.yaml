          "application/json":
            "schema":
              "$ref": "#/components/schemas/KnowledgeSearchRequest"
      "description": "Compatibility array endpoint over the same retrieval pipeline. Optional services off preserves cosine scores and vector error semantics. Actual strategy and rerank/channel states are returned in headers, including empty results. Use /api/knowledge/retrieve for full metadata. Authorize all resource scope before external calls. Bounded parallel vector/BM25 channels with independent deadlines; one failure preserves the other; all failed returns 503. Default 50/channel -> 20 fused -> optional rerank -> topK5. RRF uses ranks, keeps raw scores; generation/ownership/body/revision are rechecked before and after reranking. Keyword dirty documents are omitted until their current revision is acknowledged. No generated answer."
