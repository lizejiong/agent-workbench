      "description": "Optimistic schedule version, separate from document version. Explicit IANA timezone and Spring six-field cron. Disabled document cannot enable schedule. Changing enabled schedule conflicts with active refresh; enabled=false cancels/fences it. Re-enabling a document never re-enables its schedule."
  "/api/documents/{id}/refresh":
    "parameters":
