openapi: 3.0.3
"info":
  "title": "RAG Knowledge Base API"
  "version": "1.0.0"
  "description": "Knowledge management, uploads, reliable ingestion, structured evidence, manual content maintenance and durable document deletion. Same-PostgreSQL atomic content/vector changes; bounded persistent cleanup. Multi-format fast/fidelity parsing; explicit external capabilities, no silent OCR/profile downgrade. Controlled URL import and durable timezone-aware refresh; source metadata, active generation and conditional validators publish atomically. Optional real BM25 with transactional outbox, authoritative revision filtering, bounded parallel channels, RRF and pinned native AI reranking. Structured evidence only. API management delivery, scoped committed summary audit, operator-only Micrometer metrics. No frontend or user administration is present in this repository."
