      "type": "object"
      "additionalProperties": false
      "properties":
        "requestId":
          "type": "string"
          "minLength": 8
          "maxLength": 128
          "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
        "confirmOverwriteEdited":
          "type": "boolean"
          "default": false
        "expectedDocumentVersion":
          "type": "integer"
          "format": "int64"
          "minimum": 1
          "nullable": true
      "required":
