          "application/json":
            "schema":
              "$ref": "#/components/schemas/KnowledgeSearchRequest"
      "description": "Authorize all resource scope before external calls. Bounded parallel vector/BM25 channels with independent deadlines; one failure preserves the other; all failed returns 503. Default 50/channel -> 20 fused -> optional rerank -> topK5. RRF uses ranks, keeps raw scores; generation/ownership/body/revision are rechecked before and after reranking. Keyword dirty documents are omitted until their current revision is acknowledged. No generated answer."
