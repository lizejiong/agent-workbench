              "$ref": "#/components/schemas/SubmitIngestionRequest"
      "description": "requestId unique per trusted tenant/owner. Different document or retry source with the same requestId: 409. Different requestId while document has PENDING/RUNNING work: 409 KB_JOB_ACTIVE. Capture current document inputs in a short transaction; no model calls in HTTP request. Only FAILED/CANCELLED jobs; creates a NEW job/generation using current inputs, retryOf identifies the old job. Manual additions/edits/deletions/toggles require confirmOverwriteEdited=true AND the reviewed current expectedDocumentVersion, otherwise 409 KB_MANUAL_OVERWRITE_REQUIRED or KB_VERSION_CONFLICT. Rebuild replaces all manual changes and independent chunk enabled settings. Confirmation/version are part of requestId idempotency identity."
