        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "503":
          "$ref": "#/components/responses/Error503"
        "200":
          "description": "Same requestId replay returns the existing job, including terminal jobs"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/IngestionJobResponse"
          "headers":
            "Location":
              "schema":
                "type": "string"
            "Idempotency-Replayed":
              "schema":
                "type": "boolean"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/SubmitIngestionRequest"
      "description": "requestId unique per trusted tenant/owner. Different document or retry source with the same requestId: 409. Different requestId while document has PENDING/RUNNING work: 409 KB_JOB_ACTIVE. Capture current document inputs in a short transaction; no model calls in HTTP request. Manual additions/edits/deletions/toggles require confirmOverwriteEdited=true AND the reviewed current expectedDocumentVersion, otherwise 409 KB_MANUAL_OVERWRITE_REQUIRED or KB_VERSION_CONFLICT. Rebuild replaces all manual changes and independent chunk enabled settings. Confirmation/version are part of requestId idempotency identity."
