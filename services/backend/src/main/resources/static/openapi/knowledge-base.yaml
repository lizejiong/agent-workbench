      "description": "Bounded synchronous download and shared upload compensation. Requires server allowlist; no credentials/cookies/proxy or implicit redirects. Same key is scoped to owner/KB and immutable payload. Failed/expired import requires new key after storage recovery. ingest defaults false; true persists the same ingestion job atomically with document/import completion. First baseline only after activation."
