    "KnowledgeSearchRequest":
      "type": "object"
      "additionalProperties": false
      "properties":
        "query":
          "type": "string"
          "minLength": 1
          "maxLength": 16000
          "description": "Nonblank; trimmed. Default configured limit 4000 Unicode code points, hard cap 16000; also bounded by model request byte budget."
        "kbIds":
          "type": "array"
          "minItems": 1
          "maxItems": 64
          "uniqueItems": true
          "items":
            "type": "string"
            "format": "uuid"
          "description": "Required; default configured maximum 16. Every KB must be owned and live."
        "documentIds":
          "type": "array"
          "nullable": true
          "minItems": 1
          "maxItems": 500
          "uniqueItems": true
          "items":
            "type": "string"
            "format": "uuid"
          "description": "Optional; default configured maximum 100. Every document must be owned/live and in the selected KBs; omit to search all documents."
        "topK":
          "type": "integer"
          "format": "int64"
          "minimum": 1
          "maximum": 200
          "default": 5
          "nullable": true
          "description": "Default configured maximum 50. Applied globally after database filtering."
        "minScore":
          "type": "number"
          "format": "double"
          "nullable": true
          "minimum": -1
          "maximum": 1
          "description": "Finite cosine threshold, only valid for VECTOR strategy. Hybrid/BM25 reject this ambiguous threshold."
        "strategy":
          "type": "string"
          "enum":
            - "AUTO"
            - "VECTOR"
            - "HYBRID"
            - "KEYWORD"
          "nullable": true
          "description": "Omit to use server default AUTO. AUTO selects HYBRID only when keyword configured; otherwise VECTOR."
        "rerank":
          "type": "boolean"
          "nullable": true
          "description": "Omit to use server default. true requires configured reranker."
        "minRerankScore":
          "type": "number"
          "format": "double"
          "nullable": true
          "description": "Finite model-specific threshold. Defaults to configured server threshold; missing rerank scores fail closed."
      "required":
        - "query"
        - "kbIds"
