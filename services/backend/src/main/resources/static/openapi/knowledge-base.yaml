    "post":
      "operationId": "uploadLocalDocument"
      "summary": "Upload UTF-8 TXT/Markdown; persist PENDING without vectorization"
      "responses":
        "201":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/DocumentResponse"
          "headers":
            "Location":
              "schema":
                "type": "string"
            "Idempotency-Replayed":
              "schema":
                "type": "boolean"
        "400":
          "$ref": "#/components/responses/Error400"
        "401":
          "$ref": "#/components/responses/Error401"
        "404":
          "$ref": "#/components/responses/Error404"
        "409":
          "$ref": "#/components/responses/Error409"
        "503":
          "$ref": "#/components/responses/Error503"
        "200":
          "description": "Idempotent replay; same document current view"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/DocumentResponse"
          "headers":
            "Location":
              "schema":
                "type": "string"
            "Idempotency-Replayed":
              "schema":
                "type": "boolean"
        "413":
          "description": "Upload type, size, structure or profile rejected before object persistence"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Envelope"
        "415":
          "description": "Upload type, size, structure or profile rejected before object persistence"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Envelope"
        "422":
          "description": "Upload type, size, structure or profile rejected before object persistence"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Envelope"
      "parameters":
        -
          "name": "Idempotency-Key"
          "in": "header"
          "schema":
            "type": "string"
            "minLength": 16
            "maxLength": 128
            "pattern": "^[A-Za-z0-9_.:-]+$"
          "required": true
      "requestBody":
        "required": true
        "content":
          "multipart/form-data":
            "schema":
              "type": "object"
              "additionalProperties": false
              "properties":
                "file":
                  "type": "string"
                  "format": "binary"
                "metadata":
                  "$ref": "#/components/schemas/UploadMetadata"
              "required":
                - "file"
            "encoding":
              "metadata":
                "contentType": "application/json"
      "description": "Streamed bounded upload with actual Tika container MIME + matching extension. TXT/Markdown/CSV strict UTF-8; PDF/DOC/DOCX/PPT/PPTX/XLS/XLSX/PNG/JPEG according to authenticated format capabilities. SVG/macros/archives rejected. Saves only PENDING, no automatic model call. ingestionSpec.parseProfile defaults fast. ZIP expansion limits apply before MIME inspection. External disabled/permanent parse errors appear in durable job stages, no silent fallback."
