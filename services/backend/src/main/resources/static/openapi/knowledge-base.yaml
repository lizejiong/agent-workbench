      "description": "Tombstone, disable and cancel/fence running ingestion atomically; immediate exclusion from search/files. Returns durable cleanup receipt. Repeated owned deletion returns same receipt even after parent deletion. Cleanup removes all generations then object outside transaction; failures persist and retry finitely. Unversioned S3 bucket and GetBucketVersioning/DeleteObject permissions required."
