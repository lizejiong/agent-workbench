name: rag-knowledge-base
services:
  elasticsearch:
    profiles: ['keyword']
    image: ${KB_ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.19.17}
    mem_limit: 1536m
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.ml.enabled: 'false'
      ingest.geoip.downloader.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '127.0.0.1:9200:9200'
    volumes:
      - knowledge-base-keywords:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: ${KB_DB_PASSWORD:?Set KB_DB_PASSWORD}
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - knowledge-base-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kb -d knowledge_base']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${KB_S3_ACCESS_KEY:?Set KB_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${KB_S3_SECRET_KEY:?Set KB_S3_SECRET_KEY}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - knowledge-base-objects:/data
    restart: unless-stopped
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      MINIO_ROOT_USER: ${KB_S3_ACCESS_KEY:?Set KB_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${KB_S3_SECRET_KEY:?Set KB_S3_SECRET_KEY}
    entrypoint: ['/bin/sh', '-ec']
    command:
      - 'until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 1; done; mc mb --ignore-existing local/knowledge-base'
    depends_on: [minio]
    restart: 'no'
  backend:
    mem_limit: 2g
    build:
      context: ../..
      dockerfile: services/backend/Dockerfile
    environment:
      KB_DB_URL: jdbc:postgresql://postgres:5432/knowledge_base?connectTimeout=5&socketTimeout=30
      KB_DB_USERNAME: kb
      KB_DB_PASSWORD: ${KB_DB_PASSWORD:?Set KB_DB_PASSWORD}
      KB_USERNAME: ${KB_USERNAME:?Set KB_USERNAME}
      KB_PASSWORD: ${KB_PASSWORD:?Set KB_PASSWORD}
      KB_TENANT_ID: ${KB_TENANT_ID:?Set KB_TENANT_ID}
      KB_USER_ID: ${KB_USER_ID:?Set KB_USER_ID}
      KB_OPERATOR: ${KB_OPERATOR:-false}
      KB_STORAGE_ENABLED: 'true'
      KB_S3_ENDPOINT: http://minio:9000
      KB_S3_REGION: us-east-1
      KB_S3_BUCKET: knowledge-base
      KB_S3_PATH_STYLE: 'true'
      KB_AI_BASE_URL: ${KB_AI_BASE_URL:-http://host.docker.internal:8081}
      KB_AI_TOKEN: ${KB_AI_TOKEN:-}
      KB_KEYWORD_ENABLED: ${KB_KEYWORD_ENABLED:-false}
      KB_ES_ENDPOINT: ${KB_ES_ENDPOINT:-http://elasticsearch:9200}
      KB_ES_API_KEY: ${KB_ES_API_KEY:-}
      KB_ES_INDEX: ${KB_ES_INDEX:-kb-chunks-v1}
      KB_ES_ANALYZER: ${KB_ES_ANALYZER:-cjk}
      KB_ES_CALL_TIMEOUT: ${KB_ES_CALL_TIMEOUT:-3s}
      KB_KEYWORD_LEASE: ${KB_KEYWORD_LEASE:-1m}
      KB_KEYWORD_MAX_SCOPE_DOCUMENTS: ${KB_KEYWORD_MAX_SCOPE_DOCUMENTS:-2000}
      KB_KEYWORD_BATCH_SIZE: ${KB_KEYWORD_BATCH_SIZE:-100}
      KB_KEYWORD_MAX_ATTEMPTS: ${KB_KEYWORD_MAX_ATTEMPTS:-5}
      KB_KEYWORD_POLL_DELAY_MS: ${KB_KEYWORD_POLL_DELAY_MS:-1000}
      KB_RETRIEVAL_STRATEGY: ${KB_RETRIEVAL_STRATEGY:-AUTO}
      KB_RETRIEVAL_CHANNEL_CANDIDATES: ${KB_RETRIEVAL_CHANNEL_CANDIDATES:-50}
      KB_RETRIEVAL_FUSION_CANDIDATES: ${KB_RETRIEVAL_FUSION_CANDIDATES:-20}
      KB_RETRIEVAL_RRF_CONSTANT: ${KB_RETRIEVAL_RRF_CONSTANT:-60}
      KB_RETRIEVAL_VECTOR_WEIGHT: ${KB_RETRIEVAL_VECTOR_WEIGHT:-1}
      KB_RETRIEVAL_KEYWORD_WEIGHT: ${KB_RETRIEVAL_KEYWORD_WEIGHT:-1}
      KB_RETRIEVAL_CONCURRENCY: ${KB_RETRIEVAL_CONCURRENCY:-4}
      KB_RETRIEVAL_VECTOR_TIMEOUT: ${KB_RETRIEVAL_VECTOR_TIMEOUT:-40s}
      KB_RETRIEVAL_KEYWORD_TIMEOUT: ${KB_RETRIEVAL_KEYWORD_TIMEOUT:-5s}
      KB_RERANK_ENABLED: ${KB_RERANK_ENABLED:-false}
      KB_RERANK_MODEL: ${KB_RERANK_MODEL:-qwen-rerank}
      KB_RERANK_TIMEOUT: ${KB_RERANK_TIMEOUT:-10s}
      KB_RERANK_MAX_INPUT_CHARS: ${KB_RERANK_MAX_INPUT_CHARS:-30000}
      KB_RERANK_MIN_SCORE: ${KB_RERANK_MIN_SCORE:-}
      KB_REMOTE_ENABLED: ${KB_REMOTE_ENABLED:-false}
      KB_REMOTE_ALLOWED_HOSTS: ${KB_REMOTE_ALLOWED_HOSTS:-}
      KB_REMOTE_TRUSTED_PRIVATE_HOSTS: ${KB_REMOTE_TRUSTED_PRIVATE_HOSTS:-}
      KB_REMOTE_ALLOWED_PORTS: ${KB_REMOTE_ALLOWED_PORTS:-443,80}
      KB_REMOTE_ALLOW_HTTP: ${KB_REMOTE_ALLOW_HTTP:-false}
      KB_REMOTE_CONNECT_TIMEOUT: ${KB_REMOTE_CONNECT_TIMEOUT:-5s}
      KB_REMOTE_READ_TIMEOUT: ${KB_REMOTE_READ_TIMEOUT:-10s}
      KB_REMOTE_DOWNLOAD_TIMEOUT: ${KB_REMOTE_DOWNLOAD_TIMEOUT:-30s}
      KB_REMOTE_MAX_REDIRECTS: ${KB_REMOTE_MAX_REDIRECTS:-3}
      KB_REMOTE_MAX_BYTES: ${KB_REMOTE_MAX_BYTES:-20971520}
      KB_REMOTE_CONCURRENCY: ${KB_REMOTE_CONCURRENCY:-2}
      KB_REFRESH_LEASE: ${KB_REFRESH_LEASE:-45s}
      KB_REFRESH_DEADLINE: ${KB_REFRESH_DEADLINE:-15m}
      KB_REFRESH_MAX_ATTEMPTS: ${KB_REFRESH_MAX_ATTEMPTS:-3}
      KB_REFRESH_POLL_DELAY_MS: ${KB_REFRESH_POLL_DELAY_MS:-1000}
      KB_REMOTE_CLEANUP_POLL_DELAY_MS: ${KB_REMOTE_CLEANUP_POLL_DELAY_MS:-10000}
      KB_SEARCH_MAX_TOP_K: ${KB_SEARCH_MAX_TOP_K:-50}
      KB_SEARCH_MAX_KB_IDS: ${KB_SEARCH_MAX_KB_IDS:-16}
      KB_SEARCH_MAX_DOCUMENT_IDS: ${KB_SEARCH_MAX_DOCUMENT_IDS:-100}
      KB_SEARCH_MAX_QUERY_CHARS: ${KB_SEARCH_MAX_QUERY_CHARS:-4000}
      KB_SEARCH_MODEL_DEADLINE: ${KB_SEARCH_MODEL_DEADLINE:-40s}
      KB_PARSE_LOCAL_TIMEOUT: ${KB_PARSE_LOCAL_TIMEOUT:-30s}
      KB_PARSE_CONCURRENCY: ${KB_PARSE_CONCURRENCY:-2}
      KB_PARSE_HEAP_MB: ${KB_PARSE_HEAP_MB:-256}
      KB_PARSE_MAX_ROWS: ${KB_PARSE_MAX_ROWS:-20000}
      KB_PARSE_MAX_COLUMNS: ${KB_PARSE_MAX_COLUMNS:-128}
      KB_PARSE_MAX_SHEETS: ${KB_PARSE_MAX_SHEETS:-32}
      KB_PARSE_MAX_PAGES: ${KB_PARSE_MAX_PAGES:-500}
      KB_PARSE_MAX_RESULT_BYTES: ${KB_PARSE_MAX_RESULT_BYTES:-8388608}
      KB_IMAGE_MAX_BYTES: ${KB_IMAGE_MAX_BYTES:-2097152}
      KB_IMAGE_MAX_PIXELS: ${KB_IMAGE_MAX_PIXELS:-16777216}
      KB_MINERU_ENABLED: ${KB_MINERU_ENABLED:-false}
      KB_MINERU_BASE_URL: ${KB_MINERU_BASE_URL:-}
      KB_MINERU_TOKEN: ${KB_MINERU_TOKEN:-}
      KB_MINERU_TIMEOUT: ${KB_MINERU_TIMEOUT:-90s}
      KB_MINERU_CONNECT_TIMEOUT: ${KB_MINERU_CONNECT_TIMEOUT:-5s}
      KB_MINERU_CONCURRENCY: ${KB_MINERU_CONCURRENCY:-1}
      KB_MINERU_BACKEND: ${KB_MINERU_BACKEND:-pipeline}
      KB_MINERU_LANGUAGE: ${KB_MINERU_LANGUAGE:-ch}
      KB_VLM_ENABLED: ${KB_VLM_ENABLED:-false}
      KB_VLM_MODEL: ${KB_VLM_MODEL:-qwen-vision}
      KB_VLM_MAX_OUTPUT_TOKENS: ${KB_VLM_MAX_OUTPUT_TOKENS:-2048}
      KB_MAINTENANCE_MAX_BATCH_IDS: ${KB_MAINTENANCE_MAX_BATCH_IDS:-200}
      KB_MAINTENANCE_MODEL_DEADLINE: ${KB_MAINTENANCE_MODEL_DEADLINE:-40s}
      KB_DOCUMENT_CLEANUP_LEASE: ${KB_DOCUMENT_CLEANUP_LEASE:-4m}
      KB_DOCUMENT_CLEANUP_POLL_DELAY_MS: ${KB_DOCUMENT_CLEANUP_POLL_DELAY_MS:-10000}
      KB_CLEANUP_MAX_ATTEMPTS: ${KB_CLEANUP_MAX_ATTEMPTS:-5}
      KB_WORKER_ENABLED: ${KB_WORKER_ENABLED:-true}
      KB_WORKER_CONCURRENCY: ${KB_WORKER_CONCURRENCY:-2}
      KB_WORKER_MAX_ATTEMPTS: ${KB_WORKER_MAX_ATTEMPTS:-3}
      KB_WORKER_LEASE: ${KB_WORKER_LEASE:-30s}
      KB_WORKER_HEARTBEAT: ${KB_WORKER_HEARTBEAT:-5s}
      KB_GENERATION_CLEANUP_DELAY: ${KB_GENERATION_CLEANUP_DELAY:-10m}
      AWS_ACCESS_KEY_ID: ${KB_S3_ACCESS_KEY:?Set KB_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${KB_S3_SECRET_KEY:?Set KB_S3_SECRET_KEY}
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  knowledge-base-keywords:
  knowledge-base-data:
  knowledge-base-objects:
